name: Build Windows app

on:
  push:
    branches: ["**"]
    paths-ignore: ["knowledge/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import app; print(app.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build exe
        run: >
          pyinstaller run.py --onefile --windowed --noconfirm
          --name MapleAssistant
          --add-data "knowledge;knowledge"
          --hidden-import keyring.backends.Windows
          --icon assets/icon.ico

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MapleAssistant-${{ steps.version.outputs.version }}
          path: dist/MapleAssistant.exe

      - name: Publish release (main branch only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Maple Assistant ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/MapleAssistant.exe
          body: |
            הורד את `MapleAssistant.exe` והפעל אותו.
            בהפעלה הראשונה Windows עשוי להציג "Windows protected your PC": לחץ More info ← Run anyway.
